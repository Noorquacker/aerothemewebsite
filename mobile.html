<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Today</title>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>

<div id="phone">

  <div class="titlebar">
    <div class="start" title="Start"><img src="assets/mobile/winflag.svg" alt=""><span>start</span></div>
    <div class="title" id="app-title"></div>
    <div class="icons">
      <span class="pip signal" title="Signal"></span>
      <span class="pip batt" title="Battery"></span>
      <span class="clock" id="clock">12:00</span>
    </div>
  </div>

  <div id="today">
    <!-- Date row: clock-icon + today's date, styled as a plugin so it
         sits flush with the rest of the Today list (WM6.1 look). -->
    <div class="plugin today-date-row">
      <img src="assets/mobile/clock.png" alt="">
      <div class="lines">
        <div class="primary" id="date"></div>
      </div>
    </div>

    <div id="plugins"></div>
  </div>

  <div id="app">
    <iframe id="app-frame" src="about:blank"></iframe>
  </div>

  <div class="softkeys">
    <div class="softkey" id="sk-left">Contacts</div>
    <div class="softkey" id="sk-right">Calendar</div>
  </div>

</div>

<script src="js/mobile.js"></script>
</body>
</html>
