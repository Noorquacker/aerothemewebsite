<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desktop</title>
<script src="js/redirect.js"></script>
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body>

<div id="desktop"></div>

<div id="taskbar">
  <div id="start" title="Start"></div>
  <div id="tasks"></div>
  <div id="tray">
    <span class="tray-ico" title="Action Center"><img src="assets/tray/notify.png" alt=""></span>
    <span class="tray-ico" title="Network"><img src="assets/tray/network.png" alt=""></span>
    <span class="tray-ico" title="Volume"><img src="assets/tray/volume.png" alt=""></span>
    <div class="clock" id="clock"></div>
  </div>
  <div id="showdesktop" title="Show desktop"></div>
</div>

<script src="js/desktop.js"></script>
</body>
</html>
